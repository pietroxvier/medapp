<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F4F7">
<title>Remédios</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="tela" tabindex="-1"></main>
  <nav class="abas" id="abas" aria-label="Seções">
    <button data-aba="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Hoje</span></button>
    <button data-aba="reducao"><svg viewBox="0 0 24 24"><path d="M4 6h5v4h5v4h6v4"/></svg><span>Redução</span></button>
    <button data-aba="estoque"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Estoque</span></button>
    <button data-aba="assistente"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span>Assistente</span></button>
    <button data-aba="mais"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Ajustes</span></button>
  </nav>
  <div id="camada"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="native.js"></script>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
